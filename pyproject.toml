[project]
name = "anchor"
version = "0.1.0"
description = "Anchor — single-user private Telegram bot (Phase 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31.0,<4",
    "aiohttp>=3.14.3,<4",
    "sqlalchemy[asyncio]>=2.0.54,<3",
    "asyncpg>=0.31.0,<0.32",
    "alembic>=1.20.0,<2",
    "pydantic-settings>=2.15.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.4.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
