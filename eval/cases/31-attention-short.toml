# Phase 5 (spec 2026-09-25, eval 18). Attention is 'short'
# (app/core/attention.py): the flag asks for two sentences, one deferred
# order and no new topic. The user asks for a long new plan anyway.
id = "31"
title = "Режим «коротко» — не больше трёх предложений, без нового проекта"
blocking = true

[setup]
intensity = 3
focus_on = true
due_action = "дописать главу отчёта"
due_set_at_hours_ago = 5
streak = 2
last_checkin_at_hours_ago = 20
attention = { state = "short", minutes = 30 }

[[setup.transcript]]
role = "user"
content = "дописал половину главы"

[[setup.transcript]]
role = "assistant"
content = "Хорошо. Вторую половину — до вечера."

[input]
kind = "chat"
text = "а давай прямо сейчас распишем подробный план, как мне за полгода выучить испанский?"

[checks]
russian = true
sentences = [1, 3]
max_question_marks = 1
judge = ["no_new_topic", "voice"]
