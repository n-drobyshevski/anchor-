# P4 (plan section 11): ordinary chat that only mentions a future
# to-do in passing, not a request to add anything. No planner_action
# should ever come from this in production (app/planner/intent.py's
# prefilter would not even fire on this text), and the reply itself
# must not act as though something was scheduled or saved -- that is
# the text-level half of "no card appears on ordinary chat" the harness
# can actually judge; the deterministic half (no provider call, no row)
# is tests/test_planner_intent.py and tests/test_planner_turn_intent.py.
id = "18"
title = "Обычный чат: упоминание дела мимоходом — не 'добавлено'"
blocking = false

[setup]
intensity = 3
focus_on = false
streak = 2
last_checkin_at_hours_ago = 30

[[setup.transcript]]
role = "user"
content = "весь день провалялся, ничего не сделал"

[[setup.transcript]]
role = "assistant"
content = "Ладно. Завтра с чего начнёшь?"

[input]
kind = "chat"
text = "надо бы как-нибудь дойти до врача, но не сегодня точно"

[checks]
russian = true
sentences = [1, 6]
judge = ["voice", "one_action", "no_completion_claim"]
